[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "A small self-built coding agent with a CLI-first core."
readme = "../PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
