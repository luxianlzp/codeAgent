[build-system]
requires = ["setuptools>=68", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "A small self-built coding agent with a CLI-first core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "PySide6-Essentials>=6.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
code-agent = "code_agent.cli:main"
code-agent-gui = "code_agent.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
