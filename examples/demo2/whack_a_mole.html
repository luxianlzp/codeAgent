<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            user-select: none;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .info span {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
            margin-bottom: 20px;
        }
        .hole {
            width: 120px;
            height: 120px;
            background: #5d4037;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .mole {
            width: 80px;
            height: 80px;
            background: #8d6e63;
            border-radius: 50%;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            box-shadow: 28px 0 0 #333;
        }
        .mole::after {
            content: '';
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            background: #333;
            border-radius: 0 0 10px 10px;
        }
        .mole.up {
            bottom: 10px;
        }
        .mole.hit {
            background: #e53935;
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: #ffca28;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        .message {
            margin-top: 15px;
            font-size: 1.1rem;
            min-height: 30px;
            text-align: center;
        }
        .combo {
            color: #ffca28;
            font-weight: bold;
        }
        @media (max-width: 500px) {
            .game-container {
                grid-template-columns: repeat(3, 90px);
                grid-template-rows: repeat(3, 90px);
                gap: 10px;
            }
            .hole {
                width: 90px;
                height: 90px;
            }
            .mole {
                width: 60px;
                height: 60px;
            }
            .mole::before {
                top: 15px;
                left: 15px;
                width: 10px;
                height: 10px;
                box-shadow: 20px 0 0 #333;
            }
            .mole::after {
                top: 32px;
                width: 16px;
                height: 8px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .info {
                gap: 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>🔨 打地鼠</h1>
    <div class="info">
        <span>得分: <strong id="score">0</strong></span>
        <span>时间: <strong id="time">30</strong>秒</span>
        <span>连击: <strong id="combo">0</strong></span>
    </div>
    <div class="game-container" id="game">
        <div class="hole" data-index="0"><div class="mole"></div></div>
        <div class="hole" data-index="1"><div class="mole"></div></div>
        <div class="hole" data-index="2"><div class="mole"></div></div>
        <div class="hole" data-index="3"><div class="mole"></div></div>
        <div class="hole" data-index="4"><div class="mole"></div></div>
        <div class="hole" data-index="5"><div class="mole"></div></div>
        <div class="hole" data-index="6"><div class="mole"></div></div>
        <div class="hole" data-index="7"><div class="mole"></div></div>
        <div class="hole" data-index="8"><div class="mole"></div></div>
    </div>
    <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
    <div class="message" id="message">点击"开始游戏"开始打地鼠！</div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const comboEl = document.getElementById('combo');
        const startBtn = document.getElementById('startBtn');
        const messageEl = document.getElementById('message');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let moleTimer = null;
        let countdownTimer = null;
        let currentMole = null;
        let combo = 0;
        let lastHitTime = 0;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole() {
            const index = Math.floor(Math.random() * holes.length);
            const mole = moles[index];
            if (mole === currentMole) {
                return randomHole();
            }
            return mole;
        }

        function peep() {
            const time = randomTime(600, 1200);
            const mole = randomHole();
            currentMole = mole;
            mole.classList.add('up');
            mole.classList.remove('hit');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up');
                if (gameActive) peep();
            }, time);
        }

        function bonk(e) {
            if (!e.isTrusted) return;
            const mole = this.querySelector('.mole');
            if (!mole.classList.contains('up') || mole.classList.contains('hit')) return;

            // 计算连击
            const now = Date.now();
            if (now - lastHitTime < 1500) {
                combo++;
            } else {
                combo = 1;
            }
            lastHitTime = now;

            score++;
            mole.classList.add('hit');
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            if (combo >= 3) {
                messageEl.innerHTML = `<span class="combo">太棒了！${combo}连击！</span>`;
            } else {
                messageEl.textContent = '打中了！';
            }

            // 被击中后短暂停留再缩回
            setTimeout(() => {
                mole.classList.remove('up');
            }, 200);
        }

        holes.forEach(hole => hole.addEventListener('click', bonk));

        function startGame() {
            score = 0;
            timeLeft = 30;
            combo = 0;
            lastHitTime = 0;
            gameActive = true;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            comboEl.textContent = combo;
            startBtn.disabled = true;
            startBtn.textContent = '游戏进行中...';
            messageEl.textContent = '快打地鼠！';

            peep();

            countdownTimer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            moles.forEach(mole => mole.classList.remove('up'));
            startBtn.disabled = false;
            startBtn.textContent = '再玩一次';

            let rating = '';
            if (score >= 25) rating = '神射手！🏆';
            else if (score >= 15) rating = '非常厉害！👏';
            else if (score >= 8) rating = '还不错哦！👍';
            else rating = '再接再厉！💪';

            messageEl.innerHTML = `游戏结束！你得了 <strong>${score}</strong> 分！${rating}`;
        }
    </script>
</body>
</html>
