<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #2e7d32; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.2em;
            color: #333;
        }
        .info span { font-weight: bold; color: #d32f2f; }
        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
            margin-bottom: 20px;
        }
        .hole {
            width: 120px;
            height: 120px;
            background: #5d4037;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #4e342e;
        }
        .mole {
            width: 80px;
            height: 80px;
            background: #8d6e63;
            border-radius: 50%;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .mole::before {
            content: "🐹";
        }
        .mole.up {
            bottom: 10px;
        }
        .mole.hit {
            background: #ff5252;
            transition: background 0.1s;
        }
        .mole.hit::before {
            content: "💥";
        }
        button {
            padding: 12px 30px;
            font-size: 1.2em;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { margin-top: 15px; font-size: 1.1em; color: #333; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>🔨 打地鼠小游戏</h1>
    <div class="info">
        <div>得分: <span id="score">0</span></div>
        <div>时间: <span id="time">30</span>秒</div>
    </div>
    <div class="game-container" id="game">
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
        <div class="hole"><div class="mole" onclick="hit(this)"></div></div>
    </div>
    <button id="startBtn" onclick="startGame()">开始游戏</button>
    <div class="message" id="message">点击"开始游戏"开始打地鼠！</div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let countdownTimer = null;
        const moles = document.querySelectorAll('.mole');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const msgEl = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomMole() {
            const idx = Math.floor(Math.random() * moles.length);
            const mole = moles[idx];
            if (mole.classList.contains('up')) return randomMole();
            return mole;
        }

        function peep() {
            if (!gameActive) return;
            const time = randomTime(600, 1200);
            const mole = randomMole();
            mole.classList.add('up');
            setTimeout(() => {
                mole.classList.remove('up');
                if (gameActive) peep();
            }, time);
        }

        function hit(mole) {
            if (!gameActive || !mole.classList.contains('up') || mole.classList.contains('hit')) return;
            score++;
            scoreEl.textContent = score;
            mole.classList.add('hit');
            setTimeout(() => mole.classList.remove('hit'), 200);
            mole.classList.remove('up');
        }

        function startGame() {
            if (gameActive) return;
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            msgEl.textContent = "游戏进行中...";
            startBtn.disabled = true;
            
            peep();
            
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownTimer);
            startBtn.disabled = false;
            msgEl.textContent = `游戏结束！你打了 ${score} 只地鼠！`;
            moles.forEach(m => m.classList.remove('up'));
        }
    </script>
</body>
</html>
