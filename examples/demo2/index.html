<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            user-select: none;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info span {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            min-width: 100px;
            text-align: center;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
            margin-bottom: 20px;
        }
        .hole {
            width: 120px;
            height: 120px;
            background: #5d4037;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .mole {
            width: 80px;
            height: 80px;
            background: #8d6e63;
            border-radius: 50%;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            box-shadow: 28px 0 0 #333;
        }
        .mole::after {
            content: '';
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            background: #ffab91;
            border-radius: 0 0 10px 10px;
        }
        .mole.up {
            bottom: 10px;
        }
        .mole.hit {
            background: #e53935;
            transform: translateX(-50%) scale(0.9);
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: #ffca28;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 0 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-pause { background: #42a5f5; color: #fff; }
        .btn-stop { background: #ef5350; color: #fff; }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
            animation: fadeIn 0.3s;
        }
        .overlay.active { display: flex; }
        .overlay h2 { font-size: 3rem; margin-bottom: 15px; }
        .overlay p { font-size: 1.5rem; margin-bottom: 10px; }
        .overlay .rating { font-size: 1.2rem; margin-bottom: 25px; color: #ffca28; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .message {
            margin-top: 10px;
            font-size: 1.1rem;
            min-height: 30px;
            text-align: center;
        }
        .combo { color: #ffca28; font-weight: bold; }
        @media (max-width: 500px) {
            .game-board {
                grid-template-columns: repeat(3, 90px);
                grid-template-rows: repeat(3, 90px);
                gap: 10px;
            }
            .hole { width: 90px; height: 90px; }
            .mole { width: 60px; height: 60px; }
            .mole::before { top: 15px; left: 15px; width: 10px; height: 10px; box-shadow: 20px 0 0 #333; }
            .mole::after { top: 32px; width: 16px; height: 8px; }
            h1 { font-size: 1.8rem; }
            .info { gap: 10px; font-size: 0.95rem; }
            .info span { padding: 8px 14px; min-width: 80px; }
        }
    </style>
</head>
<body>
    <h1>🔨 打地鼠</h1>
    <div class="info">
        <span>得分: <strong id="score">0</strong></span>
        <span>时间: <strong id="time">30</strong>秒</span>
        <span>连击: <strong id="combo">0</strong></span>
    </div>
    <div class="game-board" id="board"></div>
    <div>
        <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
        <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()" style="display:none;">暂停</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopGame()" style="display:none;">停止</button>
    </div>
    <div class="message" id="message">点击"开始游戏"开始打地鼠！</div>

    <div class="overlay" id="overlay">
        <h2 id="overlayTitle">游戏结束!</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <p class="rating" id="rating"></p>
        <button class="btn" onclick="startGame()">再玩一次</button>
    </div>

    <script>
        const board = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const comboEl = document.getElementById('combo');
        const messageEl = document.getElementById('message');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const finalScoreEl = document.getElementById('finalScore');
        const ratingEl = document.getElementById('rating');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');

        let score = 0;
        let timeLeft = 30;
        let combo = 0;
        let lastHitTime = 0;
        let isPlaying = false;
        let isPaused = false;
        let timerInterval = null;
        let peepTimeout = null;
        let activeMole = null;

        function initBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                const mole = document.createElement('div');
                mole.className = 'mole';
                mole.addEventListener('click', (e) => whack(e, mole));
                hole.appendChild(mole);
                board.appendChild(hole);
            }
        }

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomMole() {
            const moles = document.querySelectorAll('.mole');
            const idx = Math.floor(Math.random() * moles.length);
            const mole = moles[idx];
            if (mole === activeMole) return randomMole();
            return mole;
        }

        function peep() {
            if (!isPlaying || isPaused) return;
            const time = randomTime(500, 1000);
            const mole = randomMole();
            activeMole = mole;
            mole.classList.remove('hit');
            mole.classList.add('up');

            peepTimeout = setTimeout(() => {
                mole.classList.remove('up');
                if (isPlaying && !isPaused) {
                    peep();
                }
            }, time);
        }

        function whack(e, mole) {
            if (!e.isTrusted || !mole.classList.contains('up') || isPaused || !isPlaying) return;

            clearTimeout(peepTimeout);
            mole.classList.remove('up');
            mole.classList.add('hit');
            setTimeout(() => mole.classList.remove('hit'), 200);

            const now = Date.now();
            if (now - lastHitTime < 1200) {
                combo++;
            } else {
                combo = 1;
            }
            lastHitTime = now;
            score++;
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            if (combo >= 3) {
                messageEl.innerHTML = `<span class="combo">太棒了！${combo}连击！🔥</span>`;
            } else {
                messageEl.textContent = '打中了！';
            }

            if (isPlaying && !isPaused) {
                peep();
            }
        }

        function startGame() {
            if (isPlaying && !isPaused) return;
            isPlaying = true;
            isPaused = false;
            score = 0;
            timeLeft = 30;
            combo = 0;
            lastHitTime = 0;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            comboEl.textContent = combo;
            messageEl.textContent = '快打地鼠！';
            overlay.classList.remove('active');
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'inline-block';
            pauseBtn.textContent = '暂停';
            initBoard();

            peep();

            timerInterval = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame('时间到！');
                }
            }, 1000);
        }

        function togglePause() {
            if (!isPlaying) return;
            if (isPaused) {
                isPaused = false;
                pauseBtn.textContent = '暂停';
                messageEl.textContent = '继续游戏！';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timeEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        endGame('时间到！');
                    }
                }, 1000);
                peep();
            } else {
                isPaused = true;
                pauseBtn.textContent = '继续';
                messageEl.textContent = '游戏已暂停';
                clearInterval(timerInterval);
                clearTimeout(peepTimeout);
            }
        }

        function stopGame() {
            if (!isPlaying) return;
            endGame('游戏已停止');
        }

        function endGame(title) {
            isPlaying = false;
            isPaused = false;
            clearInterval(timerInterval);
            clearTimeout(peepTimeout);
            activeMole = null;

            const moles = document.querySelectorAll('.mole');
            moles.forEach(m => m.classList.remove('up'));

            overlayTitle.textContent = title || '游戏结束!';
            finalScoreEl.textContent = score;

            let rating = '';
            if (score >= 25) rating = '神射手！🏆';
            else if (score >= 15) rating = '非常厉害！👏';
            else if (score >= 8) rating = '还不错哦！👍';
            else rating = '再接再厉！💪';
            ratingEl.textContent = rating;

            overlay.classList.add('active');
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            pauseBtn.style.display = 'none';
        }

        initBoard();
    </script>
</body>
</html>
