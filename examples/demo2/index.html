<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 50%, #8BC34A 50%, #558B2F 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            cursor: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50px;
            animation: floatCloud 20s linear infinite;
            z-index: 0;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
        }
        @keyframes floatCloud {
            from { transform: translateX(-200px); }
            to { transform: translateX(100vw); }
        }

        h1 {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #33691E, -1px -1px 0 #33691E;
            z-index: 1;
            letter-spacing: 5px;
        }

        .info-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 1;
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-box {
            background: #fff;
            border: 3px solid #33691E;
            border-radius: 15px;
            padding: 8px 18px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #33691E;
            box-shadow: 0 4px 0 #33691E;
            min-width: 110px;
            text-align: center;
        }

        .info-box span { color: #D32F2F; font-size: 1.3rem; }

        .game-wrapper {
            position: relative;
            z-index: 1;
            background: #795548;
            padding: 20px;
            border-radius: 20px;
            border: 6px solid #5D4037;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 5px 15px rgba(0,0,0,0.2);
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .hole {
            width: 130px;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        .hole-bg {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 50px;
            background: #5D4037;
            border-radius: 50%;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .mole {
            width: 90px;
            height: 90px;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
            cursor: none;
        }

        .mole.up { bottom: 25px; }

        .mole-body {
            width: 100%;
            height: 100%;
            background: #8D6E63;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }

        .mole.golden .mole-body {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset -5px -5px 10px rgba(0,0,0,0.1);
        }

        .mole .eyes {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            display: flex;
            justify-content: space-between;
        }

        .mole .eye {
            width: 14px;
            height: 14px;
            background: #333;
            border-radius: 50%;
            position: relative;
        }

        .mole .eye::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
        }

        .mole .nose {
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 12px;
            background: #FFAB91;
            border-radius: 50%;
            z-index: 3;
        }

        .mole .mouth {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: #5D4037;
            border-radius: 0 0 15px 15px;
            overflow: hidden;
        }

        .mole .tooth {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 0 0 3px 3px;
        }

        .mole.whacked .mole-body {
            background: #EF5350;
            transition: background 0.1s;
        }

        .mole.whacked .eye {
            background: #fff;
            height: 3px;
            width: 16px;
            border-radius: 2px;
            top: 5px;
        }

        .mole.whacked .eye::after { display: none; }

        .mole.whacked .mouth {
            background: #B71C1C;
            height: 10px;
            width: 20px;
            border-radius: 50%;
        }

        .mole.whacked .tooth { display: none; }

        .grass {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 25px;
            z-index: 3;
            pointer-events: none;
        }

        .grass-blade {
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 20px;
            background: #4CAF50;
            border-radius: 10px 10px 0 0;
            transform-origin: bottom center;
        }

        .score-popup {
            position: fixed;
            color: #FFD700;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 200;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1.3); }
        }

        .combo-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #FF5722;
            pointer-events: none;
            z-index: 150;
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff;
            opacity: 0;
        }

        .combo-text.show {
            animation: comboPop 0.6s ease-out forwards;
        }

        @keyframes comboPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        #hammer {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            width: 60px;
            height: 60px;
            transform-origin: bottom right;
            transition: transform 0.05s;
            display: none;
        }

        #hammer.active { display: block; }
        #hammer.bonk { transform: rotate(-45deg); }

        .btn {
            margin-top: 20px;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #FF6F00, #FFCA28);
            border: none;
            border-radius: 50px;
            cursor: none;
            box-shadow: 0 6px 0 #E65100, 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 1;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #E65100, 0 12px 25px rgba(0,0,0,0.25);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E65100, 0 5px 10px rgba(0,0,0,0.2);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 5px solid #33691E;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            max-width: 90%;
            width: 400px;
        }

        .overlay h2 {
            color: #33691E;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .overlay p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .overlay .big-score {
            color: #D32F2F;
            font-size: 3rem;
            font-weight: bold;
            margin: 15px 0;
            display: block;
        }

        .difficulty-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .diff-btn {
            padding: 10px 25px;
            border: 3px solid #33691E;
            background: #fff;
            color: #33691E;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .diff-btn:hover, .diff-btn.selected {
            background: #33691E;
            color: #fff;
        }

        @media (max-width: 500px) {
            h1 { font-size: 2rem; letter-spacing: 2px; }
            .game-wrapper { padding: 10px; }
            .game-container { gap: 8px; }
            .hole { width: 95px; height: 95px; }
            .hole-bg { width: 80px; height: 35px; }
            .mole { width: 65px; height: 65px; }
            .mole.up { bottom: 18px; }
            .mole .eyes { width: 45px; top: 18px; }
            .mole .eye { width: 10px; height: 10px; }
            .mole .nose { top: 30px; width: 12px; height: 10px; }
            .mole .mouth { top: 40px; width: 22px; height: 10px; }
            .info-box { font-size: 0.9rem; padding: 6px 12px; min-width: 90px; }
            #hammer { width: 45px; height: 45px; }
            .overlay-box { padding: 25px; }
            .overlay h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="cloud" style="width:100px;height:40px;top:10%;left:-100px;animation-duration:25s;"></div>
    <div class="cloud" style="width:140px;height:50px;top:20%;left:-150px;animation-duration:30s;animation-delay:5s;"></div>
    <div class="cloud" style="width:80px;height:35px;top:5%;left:-80px;animation-duration:22s;animation-delay:12s;"></div>

    <h1>🔨 打地鼠</h1>

    <div class="info-bar">
        <div class="info-box">得分: <span id="score">0</span></div>
        <div class="info-box">时间: <span id="time">30</span>秒</div>
        <div class="info-box">连击: <span id="combo">0</span></div>
        <div class="info-box">最高分: <span id="highScore">0</span></div>
    </div>

    <div class="game-wrapper">
        <div class="game-container" id="game"></div>
    </div>

    <button class="btn" id="startBtn">开始游戏</button>

    <div id="hammer">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <rect x="45" y="20" width="10" height="50" fill="#8D6E63" rx="2"/>
            <rect x="30" y="10" width="40" height="25" fill="#5D4037" rx="3"/>
            <rect x="35" y="15" width="30" height="15" fill="#795548" rx="2"/>
        </svg>
    </div>

    <div class="combo-text" id="comboText"></div>

    <div class="overlay" id="overlay">
        <div class="overlay-box">
            <h2 id="overlayTitle">准备好了吗？</h2>
            <p id="overlayMsg">选择难度开始游戏！</p>
            <div class="difficulty-select">
                <button class="diff-btn selected" data-diff="easy">简单</button>
                <button class="diff-btn" data-diff="normal">普通</button>
                <button class="diff-btn" data-diff="hard">困难</button>
            </div>
            <span class="big-score" id="finalScore" style="display:none;"></span>
            <button class="btn" id="overlayBtn" style="margin-top:10px;">开始游戏</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            easy: { time: 30, minPeep: 800, maxPeep: 1500, goldenChance: 0.1 },
            normal: { time: 30, minPeep: 500, maxPeep: 1000, goldenChance: 0.15 },
            hard: { time: 30, minPeep: 300, maxPeep: 700, goldenChance: 0.2 }
        };

        const gameContainer = document.getElementById('game');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const comboEl = document.getElementById('combo');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const overlayBtn = document.getElementById('overlayBtn');
        const startBtn = document.getElementById('startBtn');
        const hammer = document.getElementById('hammer');
        const comboText = document.getElementById('comboText');

        let score = 0;
        let timeLeft = 30;
        let combo = 0;
        let gameActive = false;
        let lastHole = null;
        let moleTimer = null;
        let countdownTimer = null;
        let currentDiff = 'easy';
        let lastHitTime = 0;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'golden') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'gameover') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(250, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        const savedHigh = localStorage.getItem('whackHighScore2');
        if (savedHigh) highScoreEl.textContent = savedHigh;

        function createHoles() {
            gameContainer.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.dataset.index = i;
                hole.innerHTML = `
                    <div class="mole">
                        <div class="mole-body">
                            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                            <div class="nose"></div>
                            <div class="mouth"><div class="tooth"></div></div>
                        </div>
                    </div>
                    <div class="hole-bg"></div>
                    <div class="grass">
                        <div class="grass-blade" style="left:10px;height:18px;transform:rotate(-10deg)"></div>
                        <div class="grass-blade" style="left:25px;height:22px;transform:rotate(5deg)"></div>
                        <div class="grass-blade" style="left:40px;height:16px;transform:rotate(-5deg)"></div>
                        <div class="grass-blade" style="left:55px;height:20px;transform:rotate(8deg)"></div>
                        <div class="grass-blade" style="left:70px;height:17px;transform:rotate(-8deg)"></div>
                        <div class="grass-blade" style="left:85px;height:21px;transform:rotate(3deg)"></div>
                    </div>
                `;
                gameContainer.appendChild(hole);
            }
        }

        createHoles();
        const holes = document.querySelectorAll('.hole');

        document.addEventListener('mousemove', (e) => {
            hammer.style.left = (e.clientX - 10) + 'px';
            hammer.style.top = (e.clientY - 40) + 'px';
            hammer.classList.add('active');
        });

        document.addEventListener('mouseleave', () => {
            hammer.classList.remove('active');
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            hammer.style.left = (touch.clientX - 10) + 'px';
            hammer.style.top = (touch.clientY - 40) + 'px';
            hammer.classList.add('active');
        }, { passive: true });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentDiff = btn.dataset.diff;
            });
        });

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole() {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole();
            lastHole = hole;
            return hole;
        }

        function peep() {
            if (!gameActive) return;
            const hole = randomHole();
            const mole = hole.querySelector('.mole');
            const cfg = CONFIG[currentDiff];
            const time = randomTime(cfg.minPeep, cfg.maxPeep);

            const isGolden = Math.random() < cfg.goldenChance;
            if (isGolden) mole.classList.add('golden');
            else mole.classList.remove('golden');

            mole.classList.add('up');
            mole.classList.remove('whacked');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up', 'golden');
                if (gameActive) peep();
            }, time);
        }

        function showScorePopup(x, y, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = (points > 0 ? '+' : '') + points;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function showComboText(text) {
            comboText.textContent = text;
            comboText.classList.remove('show');
            void comboText.offsetWidth;
            comboText.classList.add('show');
        }

        function bonk(e) {
            if (!gameActive) return;
            initAudio();

            const mole = this.querySelector('.mole');
            if (!mole.classList.contains('up') || mole.classList.contains('whacked')) return;

            hammer.classList.add('bonk');
            setTimeout(() => hammer.classList.remove('bonk'), 100);

            mole.classList.remove('up');
            mole.classList.add('whacked');

            const now = Date.now();
            if (now - lastHitTime < 1500) {
                combo++;
            } else {
                combo = 1;
            }
            lastHitTime = now;

            const isGolden = mole.classList.contains('golden');
            let points = isGolden ? 3 : 1;
            if (combo >= 3) {
                points *= 2;
                if (combo === 3 || combo === 5 || combo === 10 || combo === 15) {
                    showComboText(combo + '连击!');
                }
            }

            score += points;
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            playSound(isGolden ? 'golden' : 'hit');

            let clientX, clientY;
            if (e.type === 'touchstart') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            showScorePopup(clientX, clientY, points);
        }

        function startGame() {
            initAudio();
            score = 0;
            timeLeft = CONFIG[currentDiff].time;
            combo = 0;
            lastHitTime = 0;
            scoreEl.textContent = 0;
            timeEl.textContent = timeLeft;
            comboEl.textContent = 0;
            gameActive = true;
            overlay.classList.remove('active');
            startBtn.style.display = 'none';
            hammer.classList.add('active');

            holes.forEach(h => {
                const m = h.querySelector('.mole');
                m.classList.remove('up', 'whacked', 'golden');
            });

            peep();

            countdownTimer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            playSound('gameover');

            const currentHigh = parseInt(highScoreEl.textContent) || 0;
            let newRecord = false;
            if (score > currentHigh) {
                highScoreEl.textContent = score;
                localStorage.setItem('whackHighScore2', score);
                newRecord = true;
            }

            overlayTitle.textContent = '游戏结束!';
            overlayMsg.textContent = newRecord ? '🎉 新纪录!' : '不错的成绩!';
            finalScoreEl.textContent = score + ' 分';
            finalScoreEl.style.display = 'block';
            overlayBtn.textContent = '再玩一次';
            overlay.classList.add('active');
            startBtn.style.display = 'inline-block';

            holes.forEach(h => h.querySelector('.mole').classList.remove('up'));
        }

        holes.forEach(hole => {
            hole.addEventListener('mousedown', bonk);
            hole.addEventListener('touchstart', (e) => {
                e.preventDefault();
                bonk.call(hole, e);
            });
        });

        startBtn.addEventListener('click', () => {
            overlayTitle.textContent = '准备好了吗？';
            overlayMsg.textContent = '选择难度开始游戏！';
            finalScoreEl.style.display = 'none';
            overlayBtn.textContent = '开始游戏';
            overlay.classList.add('active');
        });

        overlayBtn.addEventListener('click', startGame);

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
