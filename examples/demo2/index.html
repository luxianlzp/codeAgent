<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            user-select: none;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .info-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-panel span {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .hole {
            width: 120px;
            height: 120px;
            background: #5d4037;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .hole:active {
            transform: scale(0.95);
        }
        .hole::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 20px;
            background: #3e2723;
            border-radius: 50%;
            opacity: 0.5;
        }
        .mole {
            width: 80px;
            height: 90px;
            background: #8d6e63;
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .mole::before, .mole::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            top: 28px;
            animation: blink 3s infinite;
        }
        .mole::before { left: 18px; }
        .mole::after { right: 18px; }
        .mole .nose {
            position: absolute;
            width: 18px;
            height: 14px;
            background: #3e2723;
            border-radius: 50%;
            top: 42px;
        }
        .mole .mouth {
            position: absolute;
            width: 24px;
            height: 10px;
            border-bottom: 3px solid #3e2723;
            border-radius: 0 0 50% 50%;
            top: 55px;
        }
        .mole .teeth {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 2px 2px;
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }
        .mole.up {
            bottom: 15px;
        }
        .mole.hit {
            background: #e53935;
            transition: bottom 0.1s, background 0.1s;
            bottom: -100% !important;
        }
        .mole.hit::before, .mole.hit::after {
            background: #fff;
            height: 3px;
            border-radius: 2px;
            transform: rotate(45deg);
            animation: none;
        }
        .mole.hit::after {
            transform: rotate(-45deg);
        }
        .mole.hit .nose, .mole.hit .mouth, .mole.hit .teeth {
            display: none;
        }
        .mole.golden {
            background: #ffca28;
        }
        .mole.golden::before, .mole.golden::after {
            background: #5d4037;
        }
        .mole.golden .nose {
            background: #f57f17;
        }
        .mole.golden .mouth {
            border-bottom-color: #f57f17;
        }
        .score-popup {
            position: absolute;
            color: #ffca28;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: #ffca28;
            color: #333;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: inherit;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .overlay.hidden {
            display: none;
        }
        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay p {
            font-size: 1.3rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .overlay .final-score {
            font-size: 2rem;
            color: #ffca28;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .overlay .high-score {
            font-size: 1rem;
            color: #ffd54f;
            margin-bottom: 25px;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .combo-display {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: #ffca28;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .combo-display.show {
            opacity: 1;
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .hammer-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 9999;
            font-size: 32px;
            transform: translate(-50%, -50%) rotate(-30deg);
            transition: transform 0.05s;
            display: none;
        }
        .hammer-cursor.active {
            transform: translate(-50%, -50%) rotate(-10deg) scale(0.9);
        }
        @media (min-width: 769px) {
            .hammer-cursor {
                display: block;
            }
            body {
                cursor: none;
            }
            .hole {
                cursor: none;
            }
        }
        @media (max-width: 500px) {
            .game-board {
                grid-template-columns: repeat(3, 90px);
                grid-template-rows: repeat(3, 90px);
                gap: 10px;
                padding: 15px;
            }
            .hole {
                width: 90px;
                height: 90px;
            }
            .mole {
                width: 60px;
                height: 70px;
            }
            .mole::before, .mole::after {
                width: 8px;
                height: 8px;
                top: 22px;
            }
            .mole::before { left: 14px; }
            .mole::after { right: 14px; }
            .mole .nose {
                width: 14px;
                height: 10px;
                top: 34px;
            }
            .mole .mouth {
                width: 18px;
                height: 8px;
                top: 44px;
            }
            .mole .teeth {
                width: 5px;
                height: 5px;
                top: 46px;
            }
            h1 { font-size: 1.8rem; }
            .info-panel { font-size: 0.9rem; gap: 10px; }
            .info-panel span { padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <h1>🔨 打地鼠</h1>
    <div class="info-panel">
        <span>得分: <strong id="score">0</strong></span>
        <span>时间: <strong id="time">30</strong> 秒</span>
        <span>最高: <strong id="highScore">0</strong></span>
    </div>
    <div class="game-board" id="board">
        <div class="hole" data-index="0"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="1"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="2"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="3"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="4"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="5"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="6"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="7"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
        <div class="hole" data-index="8"><div class="mole"><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>
    </div>
    <button class="btn" id="startBtn">开始游戏</button>

    <div class="overlay hidden" id="overlay">
        <h2>游戏结束!</h2>
        <p>最终得分</p>
        <p class="final-score" id="finalScore">0</p>
        <p class="high-score" id="finalHighScore">最高分: 0</p>
        <button class="btn" id="restartBtn">再玩一次</button>
    </div>

    <div class="combo-display" id="comboDisplay">连击 x2!</div>
    <div class="hammer-cursor" id="hammer">🔨</div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const highScoreEl = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('finalScore');
        const finalHighScoreEl = document.getElementById('finalHighScore');
        const restartBtn = document.getElementById('restartBtn');
        const comboDisplay = document.getElementById('comboDisplay');
        const hammer = document.getElementById('hammer');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let moleTimer = null;
        let countdownTimer = null;
        let lastHole = null;
        let combo = 0;
        let comboTimer = null;
        let highScore = parseInt(localStorage.getItem('whackamole_highscore')) || 0;

        highScoreEl.textContent = highScore;

        // 桌面端锤子光标跟随
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                hammer.style.left = e.clientX + 'px';
                hammer.style.top = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => hammer.classList.add('active'));
            document.addEventListener('mouseup', () => hammer.classList.remove('active'));
        }

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole() {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole();
            lastHole = hole;
            return hole;
        }

        function getDifficultyTime() {
            const elapsed = 30 - timeLeft;
            if (elapsed < 10) return randomTime(700, 1200);
            if (elapsed < 20) return randomTime(500, 900);
            return randomTime(350, 700);
        }

        function peep() {
            const time = getDifficultyTime();
            const hole = randomHole();
            const mole = hole.querySelector('.mole');
            const isGolden = Math.random() < 0.15;
            mole.classList.toggle('golden', isGolden);
            mole.classList.add('up');
            mole.classList.remove('hit');
            moleTimer = setTimeout(() => {
                mole.classList.remove('up', 'golden');
                if (gameActive) {
                    combo = 0;
                    peep();
                }
            }, time);
        }

        function showCombo() {
            if (combo >= 3) {
                comboDisplay.textContent = `连击 x${combo}!`;
                comboDisplay.classList.add('show');
                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => {
                    comboDisplay.classList.remove('show');
                }, 1000);
            }
        }

        function showScorePopup(hole, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = (points > 0 ? '+' : '') + points;
            popup.style.color = points >= 5 ? '#ffca28' : points > 0 ? '#fff' : '#ff5252';
            const rect = hole.getBoundingClientRect();
            popup.style.left = rect.left + rect.width / 2 - 15 + 'px';
            popup.style.top = rect.top + 'px';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            combo = 0;
            gameActive = true;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            startBtn.style.display = 'none';
            overlay.classList.add('hidden');
            moles.forEach(m => {
                m.classList.remove('up', 'hit', 'golden');
            });
            peep();
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            moles.forEach(m => m.classList.remove('up', 'golden'));
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whackamole_highscore', highScore);
                highScoreEl.textContent = highScore;
            }
            
            finalScoreEl.textContent = score;
            finalHighScoreEl.textContent = `最高分: ${highScore}`;
            overlay.classList.remove('hidden');
            startBtn.style.display = 'inline-block';
        }

        function bonk(e) {
            if (!e.isTrusted) return;
            const mole = this.querySelector('.mole');
            if (!mole.classList.contains('up') || mole.classList.contains('hit')) return;
            
            mole.classList.add('hit');
            mole.classList.remove('up');
            
            const isGolden = mole.classList.contains('golden');
            combo++;
            let points = 0;
            if (isGolden) {
                points = combo >= 3 ? 10 : 5;
            } else {
                points = combo >= 5 ? 3 : combo >= 3 ? 2 : 1;
            }
            score += points;
            scoreEl.textContent = score;
            
            showScorePopup(this, points);
            showCombo();
            
            clearTimeout(moleTimer);
            if (gameActive) {
                setTimeout(peep, 200);
            }
        }

        holes.forEach(hole => hole.addEventListener('mousedown', bonk));
        holes.forEach(hole => hole.addEventListener('touchstart', (e) => {
            e.preventDefault();
            bonk.call(hole, e);
        }));
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
